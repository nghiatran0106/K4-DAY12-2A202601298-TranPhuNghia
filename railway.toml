# CP5 — Cấu hình deploy Railway (dùng nếu bạn chọn Railway).
#
# Các biến môi trường KHÔNG khai báo ở đây. Đặt chúng trong dashboard hoặc:
#     railway variables --set API_TOKEN=...
#
# Railway tự gán biến PORT — app phải đọc $PORT, đừng cố định 8000.

[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
# Không đặt startCommand ở đây — Railway sẽ exec thẳng chuỗi này (không qua
# shell), nên "$PORT" không được mở rộng và bị truyền y nguyên cho uvicorn.
# Dockerfile CMD đã dùng `sh -c "... --port ${PORT:-8000}"` nên để Railway
# dùng CMD của image là đúng.
healthcheckPath = "/healthz"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
